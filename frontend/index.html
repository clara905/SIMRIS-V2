<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#243e8f" />
    <meta name="description" content="SIMRIS — ruang kerja administrasi manajemen risiko." />
    <title>SIMRIS · Administrasi risiko</title>
  </head>
  <body>
    <div id="root">
      <style>
        .preloader-bg {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: radial-gradient(circle at center 42%, #1a2233 0%, #101624 55%, #0a0e17 100%);
          color: #ffffff;
          font-family: system-ui, -apple-system, sans-serif;
          user-select: none;
        }
        .preloader-glow {
          position: absolute;
          width: 380px;
          height: 380px;
          background: radial-gradient(circle, rgba(185, 28, 44, 0.28) 0%, rgba(212, 175, 55, 0.1) 45%, transparent 70%);
          border-radius: 50%;
          animation: pl-glow 3.5s ease-in-out infinite alternate;
        }
        .preloader-logo-wrap {
          position: relative;
          width: 108px;
          height: 108px;
          display: grid;
          place-items: center;
          margin-bottom: 24px;
        }
        .preloader-ring {
          position: absolute;
          inset: 0;
          border-radius: 50%;
          border: 2px solid transparent;
          border-top-color: #d4af37;
          border-right-color: #b91c2c;
          animation: pl-spin 1.8s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
          filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.45));
        }
        .preloader-ring-inner {
          position: absolute;
          inset: 6px;
          border-radius: 50%;
          border: 1px dashed rgba(255, 255, 255, 0.18);
          animation: pl-spin-rev 6s linear infinite;
        }
        .preloader-pulse {
          position: absolute;
          inset: -10px;
          border-radius: 50%;
          border: 1px solid rgba(185, 28, 44, 0.45);
          animation: pl-pulse 2.4s ease-out infinite;
        }
        .preloader-logo {
          width: 72px;
          height: 72px;
          object-fit: contain;
          position: relative;
          z-index: 2;
          filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.65));
        }
        .preloader-title {
          font-size: 24px;
          font-weight: 700;
          letter-spacing: 4.5px;
          margin: 0 0 6px 4px;
          text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
        }
        .preloader-sub {
          font-size: 12px;
          color: #9ab0cb;
          letter-spacing: 1px;
          margin: 0 0 22px;
        }
        .preloader-track {
          width: 170px;
          height: 3px;
          background: rgba(255, 255, 255, 0.12);
          border-radius: 99px;
          overflow: hidden;
          position: relative;
          margin-bottom: 12px;
        }
        .preloader-bar {
          position: absolute;
          top: 0;
          bottom: 0;
          width: 45%;
          background: linear-gradient(90deg, #b91c2c, #d4af37, #ff6978);
          border-radius: 99px;
          animation: pl-bar 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
          box-shadow: 0 0 10px rgba(212, 175, 55, 0.6);
        }
        .preloader-msg {
          font-size: 12px;
          color: #7a8fa9;
          letter-spacing: 0.5px;
          margin: 0;
        }
        @keyframes pl-spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pl-spin-rev { 0% { transform: rotate(360deg); } 100% { transform: rotate(0deg); } }
        @keyframes pl-glow { 0% { transform: scale(0.9); opacity: 0.55; } 100% { transform: scale(1.18); opacity: 0.95; } }
        @keyframes pl-pulse { 0% { transform: scale(0.95); opacity: 0.85; } 100% { transform: scale(1.4); opacity: 0; } }
        @keyframes pl-bar { 0% { left: -45%; } 100% { left: 100%; } }
      </style>
      <div class="preloader-bg">
        <div class="preloader-glow"></div>
        <div class="preloader-logo-wrap">
          <div class="preloader-pulse"></div>
          <div class="preloader-ring-inner"></div>
          <div class="preloader-ring"></div>
          <img src="/logo-kemhan.png" alt="Logo Kemhan" class="preloader-logo" />
        </div>
        <div style="text-align: center; position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center;">
          <h1 class="preloader-title">SIMRIS</h1>
          <p class="preloader-sub">Kementerian Pertahanan Republik Indonesia</p>
          <div class="preloader-track">
            <div class="preloader-bar"></div>
          </div>
          <p class="preloader-msg">Memuat ruang kerja…</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
